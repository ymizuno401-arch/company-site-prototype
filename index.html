<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会社サイト試作 デザイン案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f5f3ef; color: #1a1a1a; padding: 32px 20px 48px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  p.lead { font-size: 14px; color: #555; margin-bottom: 28px; line-height: 1.7; }
  a.card { display: block; text-decoration: none; border-radius: 14px; padding: 22px 20px; margin-bottom: 16px; color: #fff; }
  a.card .label { font-size: 12px; letter-spacing: .12em; opacity: .85; }
  a.card .name { font-size: 20px; font-weight: 800; margin-top: 6px; }
  a.card .desc { font-size: 13px; margin-top: 6px; opacity: .9; line-height: 1.6; }
  a.blue { background: linear-gradient(135deg, #0b3d91, #1e90d6); }
  a.cprime { background: linear-gradient(135deg, #00331a, #2a0a4a); border-bottom: 4px solid #e6007e; }
  .note { font-size: 12px; color: #777; line-height: 1.7; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>会社サイト試作 デザイン案</h1>
  <p class="lead">配色の異なる2案です。タップすると各案のページが開きます。写真・文章はすべて仮のものです。</p>

  <a class="card cprime" href="./cprime/">
    <div class="label">案1</div>
    <div class="name">C' 上品寄り</div>
    <div class="desc">濃いグリーン×パープルが軸。ピンクは細い差し色だけに抑えた案です。</div>
  </a>

  <a class="card blue" href="./blue/">
    <div class="label">案2</div>
    <div class="name">BLUE系</div>
    <div class="desc">スカイブルー×ネイビーが軸。ピンクと黄色を差し色に使った案です。</div>
  </a>

  <p class="note">※ ご確認用の試作ページです。会社名・写真・文章は正式なものが届き次第差し替えます。</p>
</main>
</body>
</html>
